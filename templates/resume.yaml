  - id: trailmix
    title: "TrailMix"
    link: "trailmix.example.com"
    org: "Co-founder & Software Engineer · React Native, Node.js, PostgreSQL"
    dates: ""
    bullets:
      - text: "Co-founded TrailMix, a mobile safety app for backcountry hikers (offline maps, closure alerts, trip check-ins); led engineering and one intern to **12K monthly users** in five months"
      - text: "Built it full stack: an offline-first sync engine with conflict resolution, a multi-tenant Postgres backend with PostGIS search, and signed iOS and Android builds through a GitHub Actions CI/CD pipeline"
  - id: siteforge
