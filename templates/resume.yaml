# Resume source. Build:  python3 -m jobhunt resume --variant general   (or --all; --check reports fit without writing a PDF)
# Every claim must come from workspace/inventory.md. The content below is a FICTIONAL example (Jordan Lee) at the density
# a finished page should have: full to the bottom margin, 7 entries, 13 bullets, about 195 characters each, about three
# technical terms per bullet. The resume workshop replaces it with yours, one bullet at a time, with your approval.
# docs/RESUME_PLAYBOOK.md has every rule and the reason for it. The short version:
#   - The default reader is the engineer who decides. Serve the recruiter through word order: the plain "what" comes
#     first, the technical substance stays after it. Never remove engineering content to make a bullet easier to read.
#   - Say what you built AND why it mattered, with the stack inside the sentence. Keep public technical terms even when a
#     recruiter won't know them. Cut only private names (internal services, teams, acronyms).
#   - Frame work at its true scope, in both directions: never "built the platform" for one layer of it, and never one
#     page for platform-wide work. Say who couldn't do what before.
#   - About two lines: one for what, one for why. Bold the one thing a skimmer should catch (two only for two results).
# Format: one page, one column, full to the bottom margin, no city in the header, citizenship only when it matters for
# your targets, no summary, two skills lines of things you can be questioned on.
#
# Variants are role FAMILIES, never one per posting. A bullet can be limited with `variants: [...]` or hidden with
# `exclude_variants: [...]`; a variant can reorder projects, drop an entry and swap the skills lines.
# A bullet can carry `alt: {name: "other wording"}`; build with `--wording name` to try it.
# **double asterisks** = bold. ALWAYS quote text: an unquoted " #" starts a YAML comment and cuts the line.

default_variant: general

style:
  accent: "#1d4f91"

# Advisory checks the build reports under `style` (they never block a build).
writing:
  banned_phrases: ["increasing developer velocity", "feels instant"]   # wording you rejected; add as you go
  jargon: []                    # internal names an outsider can't read, e.g. your team's service names
  max_keyword_repeats: 3

header:
  name: "Jordan Lee"
  contact:
    - "(555) 010-0199"
    - "jordan.lee@example.com"
    - "linkedin.com/in/jlee-example"
    - "github.com/jlee-example"
    - "U.S. Citizen"

section_order: [experience, projects, education, skills]
projects_heading: "Open Source & Projects"

experience:
  - id: brightline
    title: "Software Engineer II"
    org: "Brightline Health (telehealth clinics)"
    dates: "Aug 2024 – Present"
    bullets:
      # Pattern: thing (scale) in stack with senior partners as what it became; tested, shipped, reception.
      - text: "Rebuilt Brightline's patient booking portal (>600K visits/month) in **React/TypeScript** with heads of Product and Design as a personalized feed of care tasks; A/B tested, then shipped to all patients with >80% positive ratings"
      # The current, in-demand work goes second: input-to-output shape, reach, purpose.
      - text: "Built an end-to-end **AI agent** workflow that turns Figma designs into intake-form schemas, field documentation, and matching API types; adopted across Brightline's product teams to standardize contributions"
      # Pattern: capability added through a stack (scale), enabling whom, result, replacing what.
      - text: "Added self-serve scheduling to Brightline's clinic platform through a Node.js/GraphQL service (~2M req/day), enabling clinic managers to change hours and visit types in **~2 minutes, replacing a next-day engineering release**"
      # The production-ownership bullet: a colon list is the accepted form. It proves a cluster postings ask for.
      - text: "Deployed new microservices on Brightline's AWS **Kubernetes** platform: set up API gateway routes and monitoring (Grafana dashboards, metrics, logs, alerts); created runbooks and provide on-call support"
      # Pattern: concrete thing built in a named place, the failure it fixed and how; business stake labeled honestly.
      - text: "Designed and built slot holds in the shared booking service with Redis locks, aligning three teams on a reservation API and fixing a race condition that double-booked providers; supports a projected $1.2M in visits"
  - id: northgate
    title: "Software/ML Engineer, Northgate-Sponsored Capstone"
    org: "Northgate Aerospace"
    dates: "Jan 2024 – Jun 2024"
    bullets:
      # Pattern: system for a named sponsor, a colon, then three verbs with a number on each. "Live" shows it was real.
      - text: "Built a real-time wildfire-detection system for Northgate Aerospace: ingests live satellite thermal feeds over California (900+ frames/min), scores each frame in ~40 ms, and flags new fires on a map for understaffed dispatchers"
      - text: "Trained its PyTorch U-Net (**94.2%** recall) and added Grad-CAM heatmaps of why each region was flagged; won **1st place** of 60 teams at the Pacific State senior showcase and presented to Northgate's engineering directors"
  - id: cartwheel
    title: "Software Engineer Intern"
    org: "Cartwheel Payments"
    dates: "Jun 2023 – Aug 2023"
    bullets:
      - text: "Rebuilt Cartwheel's payout-investigation tool solo with FastAPI and a **Python** ETL job that syncs 8M+ bank records nightly; ticket resolution time fell 60%, and company-wide support onboarding links to it"
  - id: lumen
    title: "Software Engineer Intern"
    org: "Lumen Learning (Bay Area edtech startup)"
    dates: "Jun 2022 – Aug 2022"
    bullets:
      # A minor entry stays one plain line: it shows another real job without taking space. A smaller side item can be a
      # single row with no bullets: set `inline_org: true`, put the description in `org`, and use `bullets: []`.
      - text: "Built the frontend for a responsive study-planner web client with CRUD workflows and REST API integration"

