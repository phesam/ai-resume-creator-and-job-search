# Resume source. Build:  python3 -m jobhunt resume --variant general   (or --all)
# Every claim must come from workspace/inventory.md. The content below is a FICTIONAL example (Jordan Lee) so the
# builder works out of the box; the resume workshop replaces it with yours, one bullet at a time, with your approval.
#
# The rules every bullet follows (docs/RESUME_PLAYBOOK.md has the reasons and before/after examples):
#   - What you built + the stack, inside the sentence + why it mattered. A recruiter who is not an engineer must be
#     able to repeat what you built and what it was for. A list of tools with no purpose fails.
#   - Name the system and its scale. Put the best result where a skimmer sees it, with its contrast right next to it
#     ("~2 minutes instead of a support ticket and a next-day release").
#   - Your real scope: "added X through a service", never "built the platform" when you built one layer of it.
#   - About two lines: one for what, one for why. Bold at most one thing per bullet.
#   - No internal names, team sizes, process trivia, or filler ("increasing velocity", "various", "leveraged").
# Formatting: one page, one column, no city in the header (it gets you filtered as non-local), citizenship in the
# header only when it matters for your targets, no summary, two skills lines of things you can be questioned on.
#
# Variants are role FAMILIES, never one per posting. A bullet can be limited with `variants: [...]` or hidden with
# `exclude_variants: [...]`; a variant can reorder projects, drop an entry and swap the skills lines.
# A bullet can carry `alt: {name: "other wording"}`; build with `--wording name` to try it.
# **double asterisks** = bold. ALWAYS quote text: an unquoted " #" starts a YAML comment and cuts the line.

default_variant: general

style:
  accent: "#1d4f91"

# Advisory checks the build reports under `style` (they never block a build).
writing:
  banned_phrases: ["increasing developer velocity", "feels instant"]   # wording you rejected; add as you go
  jargon: []                    # internal names an outsider can't read, e.g. your team's service names
  max_keyword_repeats: 3

